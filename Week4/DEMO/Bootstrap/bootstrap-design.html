<!doctype html>
<html>
  <head>
    <title>Bootstrap Design</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-black">
    <main class="container bg-info">
      <div class="row p-1">
        <div class="col-3 bg-danger">&nbsp;</div>
        <div class="col-3 bg-warning">&nbsp;</div>
        <div class="col-6 bg-success">&nbsp;</div>
      </div>
      <div
        class="row border border-5 border-primary border-opacity-75 p-3 m-2 align-items-center"
      >
        <div class="col-3 bg-success text-white text-center align-self-start">
          Just There
        </div>
        <div class="col bg-primary align-self-end">
          <div class="row text-center justify-content-center bg-info">
            <div
              class="col bg-danger text-warning text-uppercase text-decoration-underline fw-bolder"
            >
              Danger
            </div>
            <div
              class="col bg-warning text-uppercase text-decoration-underline fst-italic"
            >
              Warning
            </div>
            <div
              class="col bg-success text-info text-decoration-line-through offset-1"
            >
              All Clear
            </div>
          </div>
        </div>
        <div class="col-2 bg-secondary text-white card m-4 btn">Just Here</div>
      </div>
      <div class="row">
        <div class="col bg-warning">&nbsp;</div>
      </div>
    </main>
  </body>
</html>
