<!doctype html>
<html>
  <head>
    <title>Bootstrap Breakpoints</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="bg-primary text-white">Primary</div>
    <div class="bg-secondary text-white d-xxl-none">Secondary</div>
    <div class="bg-success text-danger d-xl-none">Success</div>
    <div class="bg-success-subtle d-lg-none">Success Subtle</div>
    <div class="bg-danger text-success d-md-none">Danger</div>
    <div class="bg-danger-subtle d-sm-none">Danger Subtle</div>
    <div class="bg-warning d-none">Warning</div>
    <div class="bg-warning-subtle d-none">Warning Subtle</div>
    <div class="bg-info d-none">info</div>
    <div class="bg-dark text-white-50 d-none">dark</div>
    <div class="bg-white d-none">White</div>
    <div class="bg-transparent d-none">Transparent</div>
  </body>
</html>
